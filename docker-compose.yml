services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: minez
      POSTGRES_PASSWORD: minez
      POSTGRES_DB: minez
    ports:
      - "5435:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minez"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
